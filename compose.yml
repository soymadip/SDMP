services:
  db:
    image: mariadb:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 5s

  dbx:
    image: t8y2/dbx:latest
    restart: always
    depends_on:
      - db
    ports:
      - "4224:4224"
    extra_hosts:
      - "host.local:host-gateway"
    environment:
      DBX_DISABLE_PASSWORD: 1
    volumes:
      - dbx_data:/app/data

