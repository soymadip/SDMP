{% extends "base.html" %}

{% block content %}
<main class="container d-flex align-items-center div-index">
	<div class="row log align-items-center py-3 px-4 border border-2 border-danger rounded-3 mx-auto w-100" style="max-width: 800px;">
		<div class="col-12 col-md-6 pe-md-5">
			<img class="d-block img-fluid text-muted" src="/src/img/icon.png" alt="{{ settings.app_name }} logo">
			<div class="text-center mt-0">
				<h4 class="mrnwthr serif">{{ settings.app_name }}</h4>
			</div>
		</div>
		<div class="col-12 col-md-6 ps-md-5">
			{% if user %}
			<div class="text-center mb-4 pb-1">
				<h1 class="fw-bold">WELCOME</h1>
				<p class="small text-muted">You are already logged in</p>
				<i class="fas fa-user me-1"></i> User Name: {{ user.username }}
			</div>
			{% else %}
			<form class="needs-validation" action="/auth/login" method="post" id="authForm">
				<div class="text-center mb-4 pb-1">
					<h1 class="fw-bold">LOGIN</h1>
					<p class="small text-muted">Please login with your credentials<br>to enter site</p>
				</div>
				<div class="mb-3 mt-1">
					<label class="form-label" for="username"><i class="fas fa-user"></i> Username</label>
					<input required name="username" id="username" type="text" class="form-control" placeholder="your username">
				</div>
				<div class="mb-5">
					<label class="form-label" for="password"><i class="fas fa-lock"></i> Password</label>
					<div class="input-group">
						<input required name="password" type="password" class="form-control" id="password" placeholder="your password">
						<button type="button" class="input-group-text" id="togglePassword" aria-label="Show password">
							<i class="fas fa-eye"></i>
						</button>
					</div>
					<div class="text-end ps-1 small-icon"><a href="/auth/forgot">Forgot Password?</a></div>
				</div>
				<div class="d-grid">
					<button type="submit" class="btn btn-success">Log in</button>
				</div>
			</form>
			{% endif %}
		</div>
	</div>
</main>
{% endblock %}
