<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" href="/src/img/favicon/favicon.ico" type="image/x-icon">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="/src/custom/custom.css">
	<title>{{ page_title | default(settings.app_name) }} | {{ settings.app_name }}</title>
</head>
<body>
	<nav class="navbar navbar-expand-md">
		<div class="container-fluid">
			<a class="navbar-brand d-flex align-items-center" href="/">
				<img src="/src/img/icon.png" alt="Logo" width="37" class="d-inline-block align-middle">
				<span class="mrnwthr fw-bold ms-2">{{ settings.app_name }}</span>
			</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse justify-content-center justify-content-sm-end text-center" id="navbarNav">
				<div class="navbar-nav align-items-center">
					<a class="nav-link" href="/"><i class="fas fa-home small-icon"></i> Home</a>
					<a class="nav-link" href="/dash/admin"><i class="fas fa-gauge small-icon"></i> Dashboard</a>
					<a class="nav-link" href="/about"><i class="fas fa-university small-icon"></i> Institute</a>
					{% if user %}
					<span class="nav-link text-muted"><i class="fas fa-user small-icon"></i> {{ user.username }}</span>
					<form action="/auth/logout" method="post" class="d-inline">
						<button type="submit" class="nav-link btn btn-link text-danger">Logout</button>
					</form>
					{% else %}
					<a class="nav-link" href="/"><i class="fas fa-sign-in-alt small-icon"></i> Login</a>
					{% endif %}
				</div>
			</div>
		</div>
	</nav>
	{% block content %}{% endblock %}
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="/src/custom/custom.js"></script>
</body>
</html>
